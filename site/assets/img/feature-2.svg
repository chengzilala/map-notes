<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="夜色地图上以一点为圆心的距离圈">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080d"/>
      <stop offset=".5" stop-color="#070c14"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <radialGradient id="sglow" cx=".7" cy=".42" r=".5">
      <stop offset="0" stop-color="#1677ff" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#1677ff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#1677ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="svig" cx=".65" cy=".45" r=".8">
      <stop offset=".4" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".6"/>
    </radialGradient>
    <filter id="ssoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="ssoft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="sgrid" width="110" height="110" patternUnits="userSpaceOnUse">
      <path d="M110 0H0V110" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sbg)"/>
  <rect width="1600" height="900" fill="url(#sgrid)"/>

  <g transform="rotate(9 800 450)" fill="none" stroke="#1b2637" stroke-width="2">
    <path d="M-200 180H1900M-200 360H1900M-200 540H1900M-200 720H1900M-200 900H1900"/>
    <path d="M120 -100V1000M400 -100V1000M680 -100V1000M960 -100V1000M1240 -100V1000M1520 -100V1000"/>
  </g>
  <g fill="none" stroke="#243449" stroke-width="8" stroke-opacity=".5" transform="rotate(9 800 450)">
    <path d="M-200 540H1900"/>
    <path d="M960 -100V1000"/>
  </g>

  <rect width="1600" height="900" fill="url(#sglow)"/>
  <circle cx="1120" cy="380" r="380" fill="#1677ff" opacity=".07"/>

  <!-- 距离圈 -->
  <g fill="none" stroke="#4d94ff">
    <circle cx="1120" cy="380" r="90" stroke-opacity=".55" stroke-width="1.5"/>
    <circle cx="1120" cy="380" r="175" stroke-opacity=".32" stroke-width="1.4" stroke-dasharray="7 9"/>
    <circle cx="1120" cy="380" r="265" stroke-opacity=".22" stroke-width="1.3"/>
    <circle cx="1120" cy="380" r="365" stroke-opacity=".13" stroke-width="1.2" stroke-dasharray="4 11"/>
  </g>
  <circle cx="1120" cy="380" r="90" fill="#1677ff" opacity=".10" filter="url(#ssoft2)"/>

  <!-- 圈上的点 -->
  <g>
    <circle cx="1210" cy="380" r="5" fill="#8fc0ff"/>
    <circle cx="1010" cy="260" r="4.5" fill="#1677ff" stroke="#cfe0ff" stroke-width="1.5"/>
    <circle cx="1180" cy="620" r="4" fill="#8fc0ff" opacity=".8"/>
    <circle cx="840" cy="460" r="3.5" fill="#6ea8ff" opacity=".7"/>
    <circle cx="1390" cy="240" r="3.5" fill="#6ea8ff" opacity=".6"/>
    <circle cx="1310" cy="620" r="3" fill="#6ea8ff" opacity=".5"/>
  </g>

  <!-- 中心点 -->
  <circle cx="1120" cy="380" r="46" fill="#1677ff" opacity=".45" filter="url(#ssoft)"/>
  <circle cx="1120" cy="380" r="17" fill="#1677ff" stroke="#eaf2ff" stroke-width="3"/>
  <circle cx="1120" cy="380" r="6" fill="#ffffff"/>

  <rect width="1600" height="900" fill="url(#svig)"/>
</svg>
